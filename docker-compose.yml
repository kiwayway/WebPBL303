services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jasa
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: jasa_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jasa -d jasa_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    command: gunicorn --reload -b 0.0.0.0:5000 run:app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://jasa:${DB_PASSWORD}@db:5432/jasa_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads: